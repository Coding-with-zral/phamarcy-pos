name: Continuous Deployment (Cloudflare Workers)

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    name: Deploy to Cloudflare Workers
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build Single Page Application
        run: npm run build

      - name: Deploy Worker to Cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        if: env.CLOUDFLARE_API_TOKEN != ''
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: 72e2e322ec1c23d1c20de1f2b0cf8cb5
          command: deploy

      - name: Cloudflare Configuration Notice
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        if: env.CLOUDFLARE_API_TOKEN == ''
        run: |
          echo "::notice ::To enable direct deployment to Cloudflare Workers (phamarcy-pos.kipkoechkev6.workers.dev), add CLOUDFLARE_API_TOKEN under GitHub Settings > Secrets and variables > Actions."
          echo "Build and typecheck passed successfully."
